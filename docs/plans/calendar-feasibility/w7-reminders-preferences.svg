<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Připomenutí chodí jako notifikace systému a kalendář má vlastní stránku Předvoleb" font-size="11.5" font-family="Inter, Cantarell, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Připomenutí chodí jako notifikace systému, kalendář má stránku Předvoleb</text><text x="24" y="48" fill="#5c5c5c">Vlevo notifikace GNOME, vpravo Předvolby → Kalendář</text><g><rect x="24" y="64" width="280" height="144" rx="12" fill="none" stroke="#b9b7ad" stroke-width="1.25"/><circle cx="50" cy="90" r="12" fill="#2b76d2" fill-opacity="0.25" stroke="#2b76d2"/><text x="70" y="94" font-size="10.5" fill="#5c5c5c">Malachi Mail · teď</text><text x="40" y="128" font-size="12.5" font-weight="600" fill="#1f1f1f">Revize rozpočtu za 15 minut</text><text x="40" y="146" fill="#5c5c5c">14:00–15:00 · Zasedačka 3</text><rect x="40" y="166" width="76" height="26" rx="6" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1"/><rect x="124" y="166" width="76" height="26" rx="6" fill="#2b76d2" fill-opacity="0.15" stroke="#2b76d2" stroke-width="1.5"/><rect x="208" y="166" width="80" height="26" rx="6" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1"/><text x="78" y="183" text-anchor="middle" fill="#1f1f1f">Odložit</text><text x="162" y="183" text-anchor="middle" font-weight="600" fill="#1f1f1f">Připojit</text><text x="248" y="183" text-anchor="middle" fill="#1f1f1f">Zavřít</text></g><g><text x="24" y="236" fill="#5c5c5c">Odložit a Zavřít jdou do Graphu</text><text x="24" y="252" fill="#5c5c5c">(snoozeReminder, dismissReminder),</text><text x="24" y="268" fill="#5c5c5c">takže připomenutí zmizí i v Outlooku</text><text x="24" y="284" fill="#5c5c5c">na telefonu.</text><text x="24" y="316" fill="#5c5c5c">macOS: akce UNNotificationCategory,</text><text x="24" y="332" fill="#5c5c5c">Windows: AppNotification s tlačítky.</text><text x="24" y="364" fill="#5c5c5c">Klik na notifikaci otevře detail (W4).</text></g><g><rect x="320" y="64" width="416" height="512" rx="8" fill="none" stroke="#b9b7ad" stroke-width="1.25"/><rect x="336" y="76" width="96" height="26" rx="6" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1"/><rect x="432" y="76" width="96" height="26" rx="6" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1"/><rect x="528" y="76" width="96" height="26" rx="6" fill="#2b76d2" fill-opacity="0.15" stroke="#2b76d2" stroke-width="1.5"/><rect x="624" y="76" width="96" height="26" rx="6" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1"/><text x="384" y="93" text-anchor="middle" fill="#1f1f1f">Obecné</text><text x="480" y="93" text-anchor="middle" fill="#1f1f1f">Seznam zpráv</text><text x="576" y="93" text-anchor="middle" font-weight="600" fill="#1f1f1f">Kalendář</text><text x="672" y="93" text-anchor="middle" fill="#1f1f1f">AI</text></g><g><text x="336" y="128" font-size="10.5" font-weight="600" fill="#5c5c5c">ZOBRAZENÍ</text><rect x="336" y="136" width="384" height="108" rx="8" fill="none" stroke="#b9b7ad" stroke-width="1"/><line x1="336" y1="172" x2="720" y2="172" stroke="#e4e3df"/><line x1="336" y1="208" x2="720" y2="208" stroke="#e4e3df"/><text x="348" y="158" fill="#1f1f1f">Výchozí pohled</text><text x="708" y="158" text-anchor="end" fill="#5c5c5c">Týden ▾</text><text x="348" y="194" fill="#1f1f1f">Začátek pracovní doby</text><text x="708" y="194" text-anchor="end" fill="#5c5c5c">8:00 ▾</text><text x="348" y="230" fill="#1f1f1f">První den týdne</text><text x="708" y="230" text-anchor="end" fill="#5c5c5c">Podle jazyka ▾</text></g><g><text x="336" y="270" font-size="10.5" font-weight="600" fill="#5c5c5c">PŘIPOMENUTÍ</text><rect x="336" y="278" width="384" height="72" rx="8" fill="none" stroke="#b9b7ad" stroke-width="1"/><line x1="336" y1="314" x2="720" y2="314" stroke="#e4e3df"/><text x="348" y="300" fill="#1f1f1f">Upozornit 