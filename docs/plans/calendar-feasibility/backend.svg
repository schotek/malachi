<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" role="img" aria-label="Kalendář je třetí pracovník účtu vedle synchronizace pošty a outboxu" font-size="11.5" font-family="Inter, Cantarell, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="be-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b7ad"/></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Kalendář je třetí pracovník účtu vedle synchronizace pošty a outboxu</text><g><rect x="24" y="40" width="12" height="12" rx="3" fill="#2b76d2" fill-opacity="0.12" stroke="#2b76d2" stroke-width="2"/><text x="42" y="50" fill="#5c5c5c">nové</text><rect x="84" y="40" width="12" height="12" rx="3" fill="none" stroke="#b9b7ad" stroke-width="1.25"/><text x="102" y="50" fill="#5c5c5c">existující nebo rozšířené</text></g><g fill="none" stroke="#b9b7ad" stroke-width="1.25"><path d="M380 124V140H148V184" marker-end="url(#be-arrow)"/><path d="M380 124V184" marker-end="url(#be-arrow)"/><path d="M380 140H612V184" marker-end="url(#be-arrow)"/><path d="M148 256V288" marker-end="url(#be-arrow)"/><path d="M380 256V288" marker-end="url(#be-arrow)"/><path d="M512 236H496V272H464V288" marker-end="url(#be-arrow)"/><path d="M612 256V288" marker-end="url(#be-arrow)"/><path d="M400 360V392" marker-end="url(#be-arrow)"/><path d="M612 360V392" marker-end="url(#be-arrow)"/><path d="M280 428H248" marker-end="url(#be-arrow)"/><path d="M496 464V504H104V528" marker-end="url(#be-arrow)"/><path d="M496 504H288V528" marker-end="url(#be-arrow)"/><path d="M496 504H472V528" marker-end="url(#be-arrow)"/><path d="M496 504H656V528" marker-end="url(#be-arrow)"/></g><g><rect x="270" y="64" width="220" height="60" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="380" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Microsoft Graph</text><text x="380" y="106" text-anchor="middle" fill="#5c5c5c">calendarView/delta, events, accept</text></g><g><rect x="24" y="152" width="712" height="336" rx="10" fill="none" stroke="#b9b7ad" stroke-width="1.25" stroke-dasharray="6 4"/><text x="40" y="480" font-size="12" font-weight="600" fill="#5c5c5c">malachid (démon), jeden Graph klient na účet</text></g><g><rect x="48" y="184" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="148" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Sync pošty</text><text x="148" y="226" text-anchor="middle" fill="#5c5c5c">pozná pozvánky (K0)</text></g><g><rect x="280" y="184" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="380" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Outbox</text><text x="380" y="226" text-anchor="middle" fill="#5c5c5c">beze změny</text></g><g><rect x="512" y="184" width="200" height="72" rx="8" fill="#2b76d2" fill-opacity="0.12" stroke="#2b76d2" stroke-width="2"/><text x="612" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Sync kalendáře</text><text x="612" y="226" text-anchor="middle" fill="#1f1f1f">delta po kalendářích</text><text x="612" y="242" text-anchor="middle" fill="#1f1f1f">fronta event_ops</text></g><g><rect x="48" y="288" width="432" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="64" y="312" font-size="13" font-weight="600" fill="#1f1f1f">Store (SQLite)</text><text x="64" y="330" fill="#5c5c5c">pošta: folders, messages, message_ops</text><text x="64" y="346" fill="#1f1f1f">nové: calendars, events, event_ops (migrace 0015)</text></g><g><rect x="512" y="288" width="200" height="72" rx="8" fill="#2b76d2" fill-opacity="0.12" stroke="#2b76d2" stroke-width="2"/><text x="612" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Připomenutí</text><text x="612" y="330" text-anchor="middle" fill="#1f1f1f">časovač z reminderMinutes</text><text x="612" y="346" text-anchor="middle" fill="#1f1f1f">notifikace calendar.reminder</text></g><g><rect x="48" y="392" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="148" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Sanitizér</text><text x="148" y="434" text-anchor="middle" fill="#5c5c5c">popis události jako tělo</text><text x="148" y="450" text-anchor="middle" fill="#5c5c5c">zprávy, nikdy surové</text></g><g><rect x="280" y="392" width="432" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="296" y="416" font-size="13" font-weight="600" fill="#1f1f1f">RPC (rozšířené)</text><text x="296" y="434" fill="#1f1f1f">calendar.list, event.list, event.get, event.respond,</text><text x="296" y="450" fill="#1f1f1f">event.save, event.delete · calendar.changed</text></g><g><rect x="24" y="528" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="104" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">GTK</text><text x="104" y="568" text-anchor="middle" fill="#5c5c5c">pohled Kalendář</text><rect x="208" y="528" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="288" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">macOS</text><text x="288" y="568" text-anchor="middle" fill="#5c5c5c">pohled Kalendář</text><rect x="392" y="528" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="472" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Windows</text><text x="472" y="568" text-anchor="middle" fill="#5c5c5c">pohled Kalendář</text><rect x="576" y="528" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b9b7ad" stroke-width="1.25"/><text x="656" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">MCP most</text><text x="656" y="568" text-anchor="middle" fill="#5c5c5c">nástroje kalendáře</text></g></svg>
