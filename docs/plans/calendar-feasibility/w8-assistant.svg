<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" role="img" aria-label="Asistent čte kalendář přes most jen pro čtení a odpověď připraví jako koncept" font-size="11.5" font-family="Inter, Cantarell, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Asistent čte kalendář přes most jen pro čtení, odpověď připraví jako koncept</text><text x="24" y="48" fill="#5c5c5c">Pozdější fáze · panel asistenta (cíl V aplikaci) vedle týdenního pohledu</text><g><rect x="24" y="64" width="712" height="496" rx="8" fill="none" stroke="#b9b7ad" stroke-width="1.25"/><line x1="24" y1="104" x2="736" y2="104" stroke="#b9b7ad"/><line x1="448" y1="64" x2="448" y2="560" stroke="#b9b7ad"/></g><g><text x="40" y="90" font-size="12.5" font-weight="600" fill="#1f1f1f">28. 9. – 4. 10. 2026</text><line x1="56" y1="112" x2="56" y2="536" stroke="#e4e3df"/><line x1="112" y1="112" x2="112" y2="536" stroke="#e4e3df"/><line x1="168" y1="112" x2="168" y2="536" stroke="#e4e3df"/><line x1="224" y1="112" x2="224" y2="536" stroke="#e4e3df"/><line x1="280" y1="112" x2="280" y2="536" stroke="#e4e3df"/><line x1="336" y1="112" x2="336" y2="536" stroke="#e4e3df"/><line x1="392" y1="112" x2="392" y2="536" stroke="#e4e3df"/><line x1="448" y1="112" x2="448" y2="536" stroke="#e4e3df"/><line x1="56" y1="136" x2="448" y2="136" stroke="#e4e3df"/><line x1="56" y1="176" x2="448" y2="176" stroke="#e4e3df"/><line x1="56" y1="216" x2="448" y2="216" stroke="#e4e3df"/><line x1="56" y1="256" x2="448" y2="256" stroke="#e4e3df"/><line x1="56" y1="296" x2="448" y2="296" stroke="#e4e3df"/><line x1="56" y1="336" x2="448" y2="336" stroke="#e4e3df"/><line x1="56" y1="376" x2="448" y2="376" stroke="#e4e3df"/><line x1="56" y1="416" x2="448" y2="416" stroke="#e4e3df"/><line x1="56" y1="456" x2="448" y2="456" stroke="#e4e3df"/><line x1="56" y1="496" x2="448" y2="496" stroke="#e4e3df"/><line x1="56" y1="536" x2="448" y2="536" stroke="#e4e3df"/><text x="84" y="128" text-anchor="middle" font-size="10.5" fill="#5c5c5c">Po</text><text x="140" y="128" text-anchor="middle" font-size="10.5" fill="#5c5c5c">Út</text><text x="196" y="128" text-anchor="middle" font-size="10.5" fill="#5c5c5c">St</text><text x="252" y="128" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f1f1f">Čt</text><text x="308" y="128" text-anchor="middle" font-size="10.5" fill="#5c5c5c">Pá</text><text x="364" y="128" text-anchor="middle" font-size="10.5" fill="#5c5c5c">So</text><text x="420" y="128" text-anchor="middle" font-size="10.5" fill="#5c5c5c">Ne</text><rect x="59" y="177" width="50" height="38" rx="4" fill="#e4e3df" stroke="#b9b7ad" stroke-width="0.75"/><rect x="115" y="337" width="50" height="58" rx="4" fill="#e4e3df" stroke="#b9b7ad" stroke-width="0.75"/><rect x="171" y="217" width="24" height="58" rx="4" fill="#e4e3df" stroke="#b9b7ad" stroke-width="0.75"/><rect x="197" y="237" width="24" height="58" rx="4" fill="#e4e3df" stroke="#b9b7ad" stroke-width="0.75"/><rect x="283" y="217" width="50" height="38" rx="4" fill="#e4e3df" stroke="#b9b7ad" stroke-width="0.75"/><rect x="227" y="377" width="50" height="38" rx="4" fill="#2b76d2" fill-opacity="0.2" stroke="#2b76d2" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="552" font-size="10.5" fill="#5c5c5c">událost, o které asistent mluví, je zvýrazněná</text></g><g><text x="464" y="90" font-size="13" font-weight="600" fill="#1f1f1f">✦ Asistent</text><text x="720" y="90" text-anchor="end" fill="#5c5c5c">Claude Code</text></g><g><rect x="520" y="116" width="200" height="40" rx="10" fill="#2b76d2" fill-opacity="0.12" stroke="#2b76d2" stroke-width="1"/><text x="532" y="132" fill="#1f1f1f">Co mám zítra a na co</text><text x="532" y="148" fill="#1f1f1f">se připravit?</text></g><g><circle cx="468" cy="172" r="3" fill="#5c5c5c"/><text x="478" y="176" font-size="10.5" fill="#5c5c5c">Čte kalendář: list_events</text><circle cx="468" cy="190" r="3" fill="#5c5c5c"/><text x="478" y="194" font-size="10.5" fill="#5c5c5c">Čte poštu: search_messages</text></g><g><text x="464" y="220" font-weight="600" fill="#1f1f1f">Zítra, čtvrtek 1. října:</text><text x="464" y="240" fill="#1f1f1f">• Konference, celý den.</text><text x="464" y="258" fill="#1f1f1f">• 14:00 Revize rozpočtu, pozvánka</text><text x="476" y="274" fill="#1f1f1f">bez odpovědi; koliduje s konferencí.</text><text x="464" y="292" fill="#1f1f1f">• Jana 28. 9. poslala tabulku k revizi.</text><text x="464" y="316" fill="#1f1f1f">Navrhuji odpovědět Nezávazně</text><text x="464" y="332" fill="#1f1f1f">a požádat o jiný čas.</text></g><g><rect x="464" y="346" width="256" height="50" rx="8" fill="#2b76d2" fill-opacity="0.06" stroke="#2b76d2" stroke-width="1.5"/><text x="476" y="366" font-weight="600" fill="#1f1f1f">Koncept odpovědi Janě</text><text x="476" y="384" font-weight="600" fill="#2b76d2">Otevřít koncept</text></g><g><text x="464" y="418" font-size="10.5" fill="#5c5c5c">Na pozvánku odpovídá uživatel sám; nástroj</text><text x="464" y="432" font-size="10.5" fill="#5c5c5c">odpovědi je za --allow-modify.</text></g><g><rect x="464" y="452" width="72" height="24" rx="12" fill="none" stroke="#2b76d2" stroke-width="1.25"/><rect x="544" y="452" width="124" height="24" rx="12" fill="none" stroke="#2b76d2" stroke-width="1.25"/><rect x="464" y="484" width="152" height="24" rx="12" fill="none" stroke="#2b76d2" stroke-width="1.25"/><text x="500" y="468" text-anchor="middle" fill="#2b76d2">Můj den</text><text x="606" y="468" text-anchor="middle" fill="#2b76d2">Najít volný čas</text><text x="540" y="500" text-anchor="middle" fill="#2b76d2">Příprava na schůzku</text></g><g><rect x="464" y="520" width="256" height="28" rx="8" fill="none" stroke="#b9b7ad" stroke-width="1"/><text x="476" y="538" font-size="10.5" fill="#5c5c5c">Zeptejte se na poštu nebo kalendář…</text><circle cx="706" cy="534" r="9" fill="#2b76d2" fill-opacity="0.7"/></g></svg>
