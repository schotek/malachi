a instance okna pro aplikaci;</text><text x="44" y="594" font-size="10.5" fill="#1f1f1f">druhé vyvolání ho jen přenese do popředí; hlavní okno</text><text x="44" y="608" font-size="10.5" fill="#1f1f1f">se nemění (žádný čtvrtý režim).</text><circle cx="32" cy="626.2" r="7" fill="#e66100"/><text x="32" y="629.4" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="44" y="630" font-size="10.5" fill="#1f1f1f"><tspan font-weight="600">Zobrazit kontakt</tspan> jen při přesné shodě adresy</text><text x="44" y="644" font-size="10.5" fill="#1f1f1f">(contact.lookup), nikdy podle jména.</text><circle cx="32" cy="662.2" r="7" fill="#e66100"/><text x="32" y="665.4" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="44" y="666" font-size="10.5" fill="#1f1f1f">U neznámé adresy <tspan font-weight="600">Přidat do kontaktů…</tspan> (W4).</text><circle cx="404" cy="576.2" r="7" fill="#e66100"/><text x="404" y="579.4" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="416" y="580" font-size="10.5" fill="#1f1f1f">Zdroj contacts = adresáře účtu odesílatele; stejná adresa</text><text x="416" y="594" font-size="10.5" fill="#1f1f1f">z více zdrojů je jeden řádek, jméno z kontaktu má přednost;</text><text x="416" y="608" font-size="10.5" fill="#1f1f1f">kontakt se dvěma adresami = dva řádky.</text><circle cx="404" cy="626.2" r="7" fill="#e66100"/><text x="404" y="629.4" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">5</text><text x="416" y="630" font-size="10.5" fill="#1f1f1f">Nedávno použité zůstávají; na Linuxu se knihy EDS účtu,</text><text x="416" y="644" font-size="10.5" fill="#1f1f1f">jehož kontakty synchronizuje démon, přeskočí.</text></svg>
