<line x1="360" y1="314" x2="736" y2="314" stroke="#d9d7d2"/>
<rect x="360" y="314" width="376" height="50" fill="#f6f5f4"/>
<rect x="372" y="327" width="94" height="24" rx="6" fill="#ffffff" stroke="#b9b7ad"/><use xlink:href="#i-reply" x="378" y="332" width="14" height="14" fill="none" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="343" fill="#1f1f1f">Odpovědět</text><text x="452" y="343" font-size="9" fill="#5c5c5c">▾</text>
<rect x="474" y="327" width="152" height="24" rx="6" fill="#ffffff" stroke="#b9b7ad"/><text x="482" y="343" fill="#8a8a8a">Napsat odpověď…</text>
<g fill="none" stroke="#b9b7ad"><rect x="634" y="327" width="28" height="24" rx="6"/><rect x="666" y="327" width="28" height="24" rx="6"/></g>
<use xlink:href="#i-spark" x="641" y="332" width="14" height="14" fill="none" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<use xlink:href="#i-open" x="673" y="332" width="14" height="14" fill="none" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="698" y="327" width="28" height="24" rx="6" fill="#3584e4" opacity="0.45"/><use xlink:href="#i-send" x="705" y="332" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="24" y="64" width="712" height="300" rx="10" fill="none" stroke="#b9b7ad"/>
<text x="24" y="382" font-size="10.5" fill="#1f1f1f"><tspan font-weight="700">A · jedna zpráva.</tspan> Řádek stojí dole v panelu čtení, pod tělem zprávy, na stejném místě jako pod chatem. Cíl = zobrazená zpráva;</text>
<text x="24" y="396" font-size="10.5" fill="#1f1f1f">tooltip režimu „Odpověď pro: Lucie Horáková“. Odpovědět všem a Přeposlat… podle schopností účtu; u Jira položky jen Komentovat.</text>

<!-- B: where it does not show -->
<g font-size="10.5">
<rect x="24" y="414" width="226" height="120" rx="8" fill="#f6f5f4" stroke="#b9b7ad"/>
<text x="36" y="432" font-weight="700" fill="#1f1f1f">B · chat konverzace</text>
<rect x="36" y="442" width="120" height="18" rx="9" fill="#e7e5e1"/><text x="44" y="454" fill="#1f1f1f">Můžete to poslat?</text>
<rect x="110" y="466" width="128" height="18" rx="9" fill="#cfe1fb"/><text x="118" y="478" fill="#1f1f1f">Ano, dnes odpoledne.</text>
<line x1="36" y1="496" x2="238" y2="496" stroke="#d9d7d2"/>
<rect x="36" y="504" width="58" height="18" rx="5" fill="#ffffff" stroke="#b9b7ad"/><text x="42" y="516" font-size="9">Odpovědět ▾</text>
<rect x="98" y="504" width="86" height="18" rx="5" fill="#ffffff" stroke="#b9b7ad"/><text x="104" y="516" font-size="9" fill="#8a8a8a">Napsat odpověď…</text>
<rect x="188" y="504" width="14" height="18" rx="4" fill="none" stroke="#b9b7ad"/><rect x="206" y="504" width="14" height="18" rx="4" fill="none" stroke="#b9b7ad"/><rect x="224" y="504" width="14" height="18" rx="4" fill="#3584e4" opacity="0.45"/>
<text x="36" y="546" fill="#5c5c5c">Beze změny (w4): stejný řádek, stejný stav.</text>

<rect x="266" y="414" width="226" height="120" rx="8" fill="#f6f5f4" stroke="#b9b7ad"/>
<text x="278" y="432" font-weight="700" fill="#1f1f1f">C · časová osa konverzace</text>
<rect x="278" y="442" width="202" height="30" rx="6" fill="#ffffff" stroke="#d9d7d2"/><text x="286" y="454" font-size="9.5" fill="#1f1f1f">Petr Svoboda · Re: Nabídka</text><text x="286" y="466" font-size="9" fill="#5c5c5c">Odpovědět · Všem · Přeposlat</text>
<rect x="278" y="478" width="202" height="30" rx="6" fill="#ffffff" stroke="#d9d7d2"/><text x="286" y="490" font-size="9.5" fill="#1f1f1f">Vy · Re: Nabídka</text>
<text x="278" y="546" fill="#5c5c5c">Bez řádku: karty mají vlastní tlačítka.</text>

<rect x="508" y="414" width="228" height="120" rx="8" fill="#f6f5f4" stroke="#b9b7ad"/>
<text x="520" y="432" font-weight="700" fill="#1f1f1f">D · kde řádek není</text>
<text x="520" y="452" fill="#1f1f1f">· prázdný panel, „Vybráno N zpráv“</text>
<text x="520" y="468" fill="#1f1f1f">· Outbox a Koncepty (není komu odpovídat)</text>
<text x="520" y="484" fill="#1f1f1f">· účet bez schopnosti odpovědět</text>
<text x="520" y="500" fill="#1f1f1f">· samostatné okno zprávy, Nástěnka</text>
<text x="520" y="516" fill="#1f1f1f">· přiložená zpráva (.eml) v okně</text>
<text x="520" y="546" fill="#5c5c5c">Odeslané: ano, odpověď na vlastní zprávu.</text>
</g>

<g font-size="10.5" fill="#1f1f1f">
<text x="24" y="574" font-weight="700">Co se nemění</text>
<text x="24" y="590">Obsah řádku, klávesy (Enter nový řádek, ⌘/Ctrl+Enter odeslat, Escape do seznamu), odeslání přes draft.create → save → send s citací,</text>
<text x="24" y="604">Otevřít v okně s předvyplněným textem, ✦ Asistent, úzký panel jen ikona. Rozepsaný text drží vlákno zprávy: zpráva a její konverzace</text>
<text x="24" y="618">sdílejí týž text, přepnutí seznamu ho nechá; nic se neukládá do konceptů mimo Odeslat.</text>
</g>
</svg>
