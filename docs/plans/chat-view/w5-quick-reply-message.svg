<rect x="24" y="108" width="150" height="256" fill="#ecebe9"/>
<rect x="174" y="108" width="186" height="256" fill="#ffffff"/><line x1="360" y1="108" x2="360" y2="364" stroke="#d9d7d2"/>
<g font-size="10" fill="#5c5c5c"><text x="36" y="130">Doručená pošta</text><text x="36" y="148">Odeslané</text><text x="36" y="166">Koncepty</text></g>
<rect x="178" y="116" width="178" height="44" rx="6" fill="#dfe8f7"/>
<g font-size="10"><text x="188" y="131" font-weight="700" fill="#1f1f1f">Lucie Horáková</text><text x="188" y="145" fill="#1f1f1f">Faktura za říjen</text><text x="188" y="157" fill="#5c5c5c">Dobrý den, posílám fakturu…</text></g>
<g font-size="10" fill="#5c5c5c"><text x="188" y="180">Petr Svoboda</text><text x="188" y="194">Re: Nabídka – 2. patro</text><text x="188" y="218">Jira</text><text x="188" y="232">PRJ-14: Export do CSV</text></g>
<!-- reading pane: one message -->
<g font-size="10.5"><text x="380" y="130" font-size="13" font-weight="700" fill="#1f1f1f">Faktura za říjen</text>
<circle cx="389" cy="150" r="9" fill="#c9a0dc"/><text x="385" y="154" font-size="9" fill="#ffffff" font-weight="700">LH</text>
<text x="404" y="147" fill="#1f1f1f" font-weight="600">Lucie Horáková</text><text x="404" y="159" fill="#5c5c5c">Komu: Vy · dnes 9:14</text>
<rect x="640" y="140" width="84" height="18" rx="9" fill="#ffffff" stroke="#d9d7d2"/><use xlink:href="#i-clip" x="648" y="143" width="12" height="12" fill="none" stroke="#5c5c5c" stroke-width="1.6" stroke-linecap="round"/><text x="664" y="153" font-size="9.5" fill="#1f1f1f">faktura.pdf</text>
<text x="380" y="186" fill="#1f1f1f">Dobrý den,</text><text x="380" y="202" fill="#1f1f1f">posílám fakturu za říjen. Splatnost je 14 dní. Kdyby něco</text><text x="380" y="218" fill="#1f1f1f">nesedělo, dejte vědět.</text><text x="380" y="242" fill="#1f1f1f">Lucie</text></g>
