<text x="198" y="84" font-size="12.5" font-weight="700" fill="#1f1f1f">Doručená pošta</text>
<text x="198" y="99" font-size="10" fill="#5c5c5c">Faktura za říjen · 1 zpráva</text>
<g fill="none" stroke="#b9b7ad" stroke-width="1"><rect x="440" y="74" width="28" height="24" rx="6"/><rect x="472" y="74" width="28" height="24" rx="6"/><rect x="504" y="74" width="28" height="24" rx="6"/><rect x="548" y="74" width="28" height="24" rx="6"/><rect x="580" y="74" width="28" height="24" rx="6"/><rect x="624" y="74" width="28" height="24" rx="6"/><rect x="656" y="74" width="28" height="24" rx="6"/></g>
<g fill="none" stroke="#1f1f1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use xlink:href="#i-reply" x="447" y="79" width="14" height="14"/><use xlink:href="#i-reply-all" x="479" y="79" width="14" height="14"/><use xlink:href="#i-forward" x="511" y="79" width="14" height="14"/><use xlink:href="#i-trash" x="555" y="79" width="14" height="14"/><use xlink:href="#i-star" x="587" y="79" width="14" height="14"/><use xlink:href="#i-spark" x="631" y="79" width="14" height="14"/><use xlink:href="#i-more" x="663" y="79" width="14" height="14"/></g>
