<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 640" role="img" aria-label="Řádek rychlé odpovědi stojí dole v panelu čtení i pod jednou zprávou, na stejném místě jako pod chatem" font-size="11.5" font-family="Inter, Cantarell, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs>
<symbol id="i-reply" viewBox="0 0 16 16"><path d="M6.5 4 2.5 8l4 4M2.5 8H10a3.5 3.5 0 0 1 3.5 3.5V13"/></symbol>
