<symbol id="i-forward" viewBox="0 0 16 16"><path d="M9.5 4l4 4-4 4M13.5 8H6a3.5 3.5 0 0 0-3.5 3.5V13"/></symbol>
<symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9"/></symbol>
<symbol id="i-star" viewBox="0 0 16 16"><path d="M8 2.3l1.7 3.6 3.9.5-2.9 2.7.8 3.9L8 11.1 4.5 13l.8-3.9-2.9-2.7 3.9-.5z"/></symbol>
<symbol id="i-more" viewBox="0 0 16 16"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke-width="2.6"/></symbol>
<symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 1.8c.6 3.3 2.9 5.6 6.2 6.2-3.3.6-5.6 2.9-6.2 6.2-.6-3.3-2.9-5.6-6.2-6.2 3.3-.6 5.6-2.9 6.2-6.2z"/></symbol>
<symbol id="i-sidebar" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></symbol>
<symbol id="i-open" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 8 8M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></symbol>
<symbol id="i-send" viewBox="0 0 16 16"><path d="M14.2 1.8 1.8 7l5 2.2 2.2 5zM14.2 1.8 6.8 9.2"/></symbol>
<symbol id="i-clip" viewBox="0 0 16 16"><path d="M10.5 5.5 6 10a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4L4 8a4.2 4.2 0 0 0 6 6l4-4"/></symbol>
</defs>
<text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Řádek rychlé odpovědi pod jednou zprávou</text>
<text x="24" y="48" fill="#5c5c5c">macOS · panel čtení · stejný řádek dole jako pod chatem (w4), teď i u vybrané jedné zprávy (návrh S1–S9)</text>

<!-- A: single message -->
<clipPath id="clipA"><rect x="24" y="64" width="712" height="300" rx="10"/></clipPath><g clip-path="url(#clipA)">
