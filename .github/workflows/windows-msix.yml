# An MSIX test package of the Windows client, by hand only.
#
# A trial of the Microsoft Store route (docs/windows-port.md §17,
# docs/releasing.md §7): the app folder of build.ps1 app, given a package
# identity by windows/msix/build-msix.ps1. Never on a tag and never part of
# a release; no tests or lint here (windows.yml does those). The package is
# signed with a self-signed certificate made for the run, whose .cer comes
# with it in the artifact, or left unsigned for an upload to Partner Center
# (the Store re-signs it; the identity name and publisher must then be the
# ones Partner Center reserved).
#
# The artifact is kept one day: any signed-in GitHub user can download the
# artifacts of a public repository (docs/releasing.md §5).
name: Windows MSIX (test)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        type: choice
        options: [x64, arm64]
        default: x64
      sign:
        description: Sign with a self-signed test certificate (its .cer comes with the package)
        type: boolean
        default: true
      identity:
        description: Package identity name (for the Store, the one Partner Center reserved)
        type: string
        default: io.github.schotek.Malachi
      publisher:
        description: Publisher (CN=...; for the Store, the one Partner Center shows)
        type: string
        default: CN=Malachi Mail Test

permissions:
  contents: read

concurrency:
  group: windows-msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msix:
    name: MSIX (${{ inputs.arch }})
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags, so no shallow clone.
          fetch-depth: 0

      - name: Read the Go version of backend/go.mod
        # As in windows.yml.
        id: go
        run: |
          $minor = [regex]::Match([System.IO.File]::ReadAllText('backend/go.mod'), '(?m)^go (\d+\.\d+)').Groups[1].Value
          if (-not $minor) { throw 'backend/go.mod has no go directive' }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$minor`n")
          Write-Output "Go $minor"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Restore the NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ inputs.arch }}-${{ hashFiles('windows/**/packages.lock.json', 'windows/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ inputs.arch }}-

      - name: Record the version
        id: version
        working-directory: windows
        run: |
          $version = (git describe --tags --always --dirty).Trim() -replace '^v', ''
          if (-not $version) { throw 'git describe gave no version' }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
          Write-Output "version $version"

      - name: Restore, locked to the lock files
        working-directory: windows
        run: dotnet restore Malachi.slnx -p:Platform=${{ inputs.arch == 'arm64' && 'ARM64' || 'x64' }} --locked-mode

      - name: App folder
        # Release, with the daemon, the MCP bridge and the NativeAOT keyring
        # helper inside (ARM64 cross-built, as in windows.yml).
        working-directory: windows
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 app -Arch ${{ inputs.arch }}

      - name: MSIX
        working-directory: windows
        env:
          MSIX_IDENTITY: ${{ inputs.identity }}
          MSIX_PUBLISHER: ${{ inputs.publisher }}
          MSIX_VERSION: ${{ steps.version.outputs.version }}
          MSIX_SIGN: ${{ inputs.sign && '1' || '' }}
        run: |
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'msix\build-msix.ps1',
            '-AppDir', "..\build\windows\${{ inputs.arch }}\Malachi Mail", '-Version', $env:MSIX_VERSION,
            '-Arch', '${{ inputs.arch }}', '-OutDir', '..\build\windows\msix',
            '-IdentityName', $env:MSIX_IDENTITY, '-Publisher', $env:MSIX_PUBLISHER)
          if ($env:MSIX_SIGN) { $arguments += '-Sign' }
          powershell @arguments

      - uses: actions/upload-artifact@v4
        with:
          name: malachi-windows-${{ inputs.arch }}-msix-test
          path: |
            build/windows/msix/*.msix
            build/windows/msix/*.cer
          if-no-files-found: error
          retention-days: 1
