# The GTK client on Linux.
#
# One job in a Fedora 42 container, the same distribution and packages as
# the local GTK container (scripts/gtk-container/Containerfile), so what CI
# does is what `scripts/gtk-container/gtk.sh make build`, `gtk.sh test-ui`
# and `gtk.sh make lint` do on a Mac:
#
#   make build   the daemon, the MCP bridge and the GTK client
#   test-ui      go test ./... of ui/ under Xvfb (1600x1200), with the
#                compiled schema and an in-memory GSettings backend
#   smoke        the GTK smoke tests (MALACHI_GTK_SMOKE=1 and its editor and
#                card extensions) over real Blueprints and WebKitGTK
#   make lint    go vet, Blueprint, schema, desktop and metainfo files, and
#                po/malachi.pot against the sources
#
# Only pull requests and a run by hand: release packages are built by
# rpm.yml, deb.yml and flatpak.yml, and a tag runs no tests
# (docs/releasing.md §3). Nothing is uploaded; any signed-in GitHub user
# can download the artifacts of a public repository.
#
# The first compile of gotk4 takes 15–20 minutes, so the Go build cache
# and ccache are kept between runs. A pull request's cache is its own;
# every pull request can restore the one of main, which only a run by
# hand on main writes (`gh workflow run gtk.yml --ref main`), as pushes to
# main build nothing.
name: GTK

on:
  pull_request:
    paths:
      - ui/**
      - backend/**
      - po/**
      - data/**
      - NEWS
      - Makefile
      - go.work
      - go.work.sum
      - scripts/build.sh
      - scripts/gtk-container/**
      - .github/workflows/gtk.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: gtk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: build and test (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: fedora:42
    env:
      # As in the Containerfile: the caches at fixed paths for actions/cache,
      # gcc through ccache for the cgo of gotk4.
      GOPATH: /go
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /gocache
      CCACHE_DIR: /ccache
      CC: ccache gcc
      GOFLAGS: -buildvcs=false
    steps:
      - name: Install the GTK toolchain
        # The build and test packages of the Containerfile (Go 1.25 comes
        # from dnf, as the modules ask for it), without what only the
        # interactive modes need (gnome-keyring, epiphany, xauth for
        # XQuartz). Before the checkout: actions/checkout without git in
        # the container falls back to a source tarball; tar and zstd are
        # for actions/cache.
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git golang gcc ccache make pkgconf-pkg-config gettext diffutils \
            desktop-file-utils appstream tar zstd \
            gtk4-devel libadwaita-devel webkitgtk6.0-devel gsound-devel \
            gobject-introspection-devel sqlite-devel blueprint-compiler \
            xorg-x11-server-Xvfb xauth dbus-daemon procps-ng \
            tzdata glibc-langpack-cs glibc-langpack-en \
            librsvg2 adwaita-fonts-all google-noto-emoji-fonts
          go version

      - uses: actions/checkout@v7

      - name: Let git read the checkout
        # The container runs as root while the checkout is owned by the
        # runner's user; without this git refuses the directory and the
        # version the Makefile describes comes back empty.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Read the Go version
        # Part of the cache key: a new golang from dnf invalidates the Go
        # build cache, and ccache is what then saves the gotk4 compile.
        id: go
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go and C caches
        uses: actions/cache@v4
        with:
          path: |
            /go/pkg/mod
            /gocache
            /ccache
          key: gtk-f42-${{ steps.go.outputs.version }}-${{ hashFiles('backend/go.sum', 'ui/go.sum', 'go.work.sum') }}
          restore-keys: |
            gtk-f42-${{ steps.go.outputs.version }}-
            gtk-f42-

      - name: Build
        run: make build

      - name: Test the UI
        # gtk.sh test-ui: the compiled schema of make build, an in-memory
        # GSettings backend and Xvfb at the size the window tests expect.
        working-directory: ui
        env:
          GSETTINGS_BACKEND: memory
        run: |
          export GSETTINGS_SCHEMA_DIR="$GITHUB_WORKSPACE/build/glib-2.0/schemas"
          xvfb-run -a -s "-screen 0 1600x1200x24" \
            go test $(pkg-config --exists gsound || echo -tags nosound) ./...

      - name: Run the GTK smoke tests
        # The same packages with the real Blueprints, windows and WebKitGTK
        # views (CLAUDE.md, Prostředí). bwrap cannot create WebKit's
        # sandbox in an unprivileged container, as in Apple's container.
        working-directory: ui
        env:
          GSETTINGS_BACKEND: memory
          MALACHI_GTK_SMOKE: '1'
          MALACHI_GTK_EDITOR_SMOKE: '1'
          MALACHI_GTK_CARDS_SMOKE: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          export GSETTINGS_SCHEMA_DIR="$GITHUB_WORKSPACE/build/glib-2.0/schemas"
          xvfb-run -a -s "-screen 0 1600x1200x24" \
            go test $(pkg-config --exists gsound || echo -tags nosound) \
              ./internal/window/... ./internal/widget/... ./internal/accountwizard/...

      - name: Lint
        # go vet of both modules (golangci-lint is not in the image),
        # Blueprint, the schema, the desktop and metainfo files, and
        # po/malachi.pot against the sources ("run make po" when not).
        run: make lint
